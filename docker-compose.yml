services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: trade_recorder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trade_recorder"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/trade_recorder
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
